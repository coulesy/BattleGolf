<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pure Golf – Hole 13</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #2d5f1a; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; justify-content: center; padding: 10px; pointer-events: none; }
  .chip { background: rgba(32,64,26,.88); border: 2px solid #9fd06e; border-radius: 14px; padding: 6px 12px; text-align: center; min-width: 78px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .chip b { display: block; font-size: 20px; line-height: 1.1; }
  .chip span { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #c9ee96; }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(14px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; justify-content: center; pointer-events: none; }
  .prompt { background: rgba(32,64,26,.9); border: 2px solid #9fd06e; border-radius: 16px; padding: 10px 16px; font-weight: 700; font-size: 16px; text-align: center; flex: 0 1 320px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .prompt small { display: block; font-weight: 500; font-size: 12px; color: #c9ee96; margin-top: 2px; }
  .aim { pointer-events: auto; flex: none; width: 66px; height: 66px; border-radius: 50%; border: 3px solid #2d5f1a; background: #ffe14a; color: #23461a; font: inherit; font-weight: 900; box-shadow: 0 4px 0 #2d5f1a, 0 0 0 0 rgba(255,225,74,.6); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; touch-action: none; animation: aimPulse 1.8s ease-in-out infinite; }
  .aim svg { width: 26px; height: 26px; }
  .aim span { font-size: 10px; letter-spacing: .08em; margin-top: 2px; }
  .aim:active, .aim.held { transform: translateY(3px); box-shadow: 0 1px 0 #2d5f1a; background: #fff3a6; animation: none; }
  .aim[disabled] { opacity: .35; background: rgba(32,64,26,.9); color: #c9ee96; border-color: #9fd06e; box-shadow: 0 3px 0 rgba(0,0,0,.25); animation: none; }
  @keyframes aimPulse { 50% { box-shadow: 0 4px 0 #2d5f1a, 0 0 0 7px rgba(255,225,74,0); } 0%, 100% { box-shadow: 0 4px 0 #2d5f1a, 0 0 0 0 rgba(255,225,74,.6); } }
  @media (prefers-reduced-motion: reduce) { .aim { animation: none; } }
  .layers { position: fixed; right: 10px; top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 8px; }
  .layers.show { display: flex; }
  .layer { width: 58px; padding: 7px 0 5px; border-radius: 14px; border: 2px solid #9fd06e; background: rgba(32,64,26,.9); color: #c9ee96; font: inherit; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; box-shadow: 0 3px 0 rgba(0,0,0,.25); opacity: .55; }
  .layer svg { display: block; margin: 0 auto 3px; width: 26px; height: 18px; }
  .layer[aria-pressed="true"] { opacity: 1; background: #f4fbe9; color: #23461a; border-color: #2d5f1a; }
  .layer:active { transform: translateY(2px); box-shadow: none; }
  .toast { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.9); background: #fff; color: #23461a; font-weight: 900; font-size: 26px; padding: 10px 22px; border-radius: 18px; border: 3px solid #2d5f1a; box-shadow: 0 5px 0 rgba(0,0,0,.25); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,25,8,.55); }
  .modal.show { display: flex; }
  .card { background: #f4fbe9; color: #23461a; border: 4px solid #2d5f1a; border-radius: 22px; padding: 22px 26px; text-align: center; width: min(86vw, 340px); box-shadow: 0 8px 0 rgba(0,0,0,.25); }
  .card h2 { margin: 0 0 4px; font-size: 34px; }
  .card p { margin: 4px 0; font-size: 16px; }
  .card button { margin-top: 14px; font: inherit; font-weight: 800; font-size: 18px; padding: 12px 26px; border-radius: 14px; border: 3px solid #2d5f1a; background: #8fd64a; color: #1d3a12; box-shadow: 0 4px 0 #2d5f1a; }
  .card button:active { transform: translateY(3px); box-shadow: 0 1px 0 #2d5f1a; }
  .card .alt { background: transparent; box-shadow: none; border-width: 2px; font-size: 15px; padding: 8px 16px; margin-left: 6px; }
  .chip.player { border-color: var(--pc, #9fd06e); display: none; }
  .chip.player.show { display: block; }
  .chip.player b { color: var(--pc, #fff); font-size: 16px; line-height: 1.4; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: flex; gap: 8px; justify-content: center; margin: 10px 0 12px; }
  .seg button { margin: 0; width: 52px; padding: 8px 0; font-size: 20px; background: #e3f3cf; box-shadow: 0 3px 0 #2d5f1a; }
  .seg button[aria-pressed="true"] { background: #8fd64a; }
  .pname { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .pname i { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #2d5f1a; }
  .pname input { flex: 1; min-width: 0; font: inherit; font-size: 17px; font-weight: 700; color: #23461a; padding: 8px 12px; border: 2px solid #9fd06e; border-radius: 12px; background: #fff; -webkit-user-select: text; user-select: text; }
  .pname input:focus { outline: none; border-color: #2d5f1a; }
  .handover h2 { color: var(--pc); -webkit-text-stroke: 1.5px #2d5f1a; }
  .handover .ballicon { width: 54px; height: 54px; margin: 0 auto 8px; border-radius: 50%; background: var(--pc); border: 4px solid #2d5f1a; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
  .scores { list-style: none; padding: 0; margin: 12px 0 4px; text-align: left; }
  .scores li { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-bottom: 2px dashed #cfe8b4; font-weight: 700; }
  .scores li:last-child { border-bottom: none; }
  .scores i { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #2d5f1a; }
  .scores span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scores small { color: #4b7a32; font-weight: 600; }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="loading" id="loading">Loading course…</div>
<div class="hud">
  <div class="chip player" id="hPlayerChip"><b id="hPlayer">–</b><span>To play</span></div>
  <div class="chip"><b id="hStroke">0</b><span>Strokes</span></div>
  <div class="chip"><b id="hPin">–</b><span>To pin</span></div>
  <div class="chip"><b id="hLie">Tee</b><span>Lie</span></div>
</div>
<div class="bottom">
  <button class="aim" id="aimL" aria-label="Aim left (hold to keep turning)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17a9 9 0 0 0-14-9"/><path d="M5 3v5.5h5.5"/></svg><span>AIM</span></button>
  <div class="prompt" id="prompt">Tap to set distance<small>Target moves toward the hole</small></div>
  <button class="aim" id="aimR" aria-label="Aim right (hold to keep turning)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17a9 9 0 0 1 14-9"/><path d="M19 3v5.5h-5.5"/></svg><span>AIM</span></button>
</div>
<div class="layers" id="layers">
  <button class="layer" data-layer="heat" aria-pressed="true" aria-label="Slope heat map"><svg viewBox="0 0 26 18"><rect x="1" y="2" width="6" height="14" rx="2" fill="#1e50ff"/><rect x="7" y="2" width="6" height="14" fill="#3ce65a"/><rect x="13" y="2" width="6" height="14" fill="#ffdc00"/><rect x="19" y="2" width="6" height="14" rx="2" fill="#ff2846"/></svg>Heat</button>
  <button class="layer" data-layer="arrows" aria-pressed="true" aria-label="Slope arrows"><svg viewBox="0 0 26 18" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h9m-3-3 3 3-3 3" stroke="#ffdc00"/><path d="M12 13h11m-3-3 3 3-3 3" stroke="#ff2846"/></svg>Arrows</button>
  <button class="layer" data-layer="contours" aria-pressed="true" aria-label="Contour lines"><svg viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="13" cy="9" rx="11" ry="7"/><ellipse cx="14" cy="9" rx="6.5" ry="4"/><ellipse cx="15" cy="9" rx="2.5" ry="1.5"/></svg>Lines</button>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card">
  <h2 id="mTitle">Par</h2>
  <p id="mText"></p>
  <ul class="scores" id="mScores"></ul>
  <p id="mBest"></p>
  <button id="again">Play again</button><button class="alt" id="changePlayers">Players</button>
</div></div>
<div class="modal" id="setup"><div class="card">
  <h2>BattleGolf</h2>
  <p id="sHole"></p>
  <p style="margin-top:12px"><b>How many players?</b></p>
  <div class="seg" id="sCount"></div>
  <div id="sNames"></div>
  <button id="start">Tee off</button>
</div></div>
<div class="modal handover" id="handover"><div class="card">
  <div class="ballicon"></div>
  <h2 id="hoName"></h2>
  <p>Pass the phone</p>
  <p id="hoInfo"></p>
  <button id="hoGo">I'm ready</button>
</div></div>

<script>
(async function () {
  const portrait = innerHeight > innerWidth;
  const D = await (await fetch(portrait ? "game_data_portrait.json" : "game_data.json")).json();
  const img = new Image();
  img.src = portrait ? "course_portrait.jpg" : "course.jpg";
  await img.decode();
  const heatImg = new Image(); heatImg.src = D.heat.file;
  const contImg = new Image(); contImg.src = D.heat.contours;
  const detailImg = new Image(); detailImg.src = D.detail.file;
  await Promise.all([heatImg.decode(), contImg.decode(), detailImg.decode()]);
  document.getElementById("loading").remove();

  // ---------- data ----------
  const lieBytes = Uint8Array.from(atob(D.lie), ch => ch.charCodeAt(0));
  const LIE = { 0: "Rough", 1: "First cut", 2: "Fairway", 3: "Green", 4: "Tee", 5: "Trees", 9: "OB" };
  const YD = 0.9144;
  const [IW, IH] = D.img;
  const A = D.A, B = D.b;
  const toImg = (x, y) => [A[0][0] * x + A[0][1] * y + B[0], A[1][0] * x + A[1][1] * y + B[1]];
  const ppm = Math.sqrt(Math.abs(A[0][0] * A[1][1] - A[0][1] * A[1][0])); // image px per metre (approx)
  const pin = { x: D.pin[0], y: D.pin[1] };

  function lieAt(x, y) {
    for (const t of D.trees) if (Math.hypot(x - t[0], y - t[1]) < t[2] * 0.75) return 5;
    const i = Math.floor((x - D.gx0) / D.cell), j = Math.floor((y - D.gy0) / D.cell);
    if (i < 0 || j < 0 || i >= D.nx || j >= D.ny) return 9;
    return lieBytes[j * D.nx + i];
  }

  // ---------- green slope (from the green elevation grid, 2 m cells, cm) ----------
  const GG = D.green_grid, gn = GG.n, gstep = GG.step, gcm = GG.cm;
  const cr = Math.cos(-D.north_rot), sr = Math.sin(-D.north_rot);
  function heightAt(x, y) {
    const xg = x - D.pin[0], yg = y - D.pin[1];
    const E = cr * xg - sr * yg, N = sr * xg + cr * yg;
    const gi = Math.min(gn - 1.001, Math.max(0, (gn - 1) / 2 - N / gstep));
    const gj = Math.min(gn - 1.001, Math.max(0, (gn - 1) / 2 + E / gstep));
    const i = Math.floor(gi), j = Math.floor(gj), fi = gi - i, fj = gj - j;
    const v = (a, b) => gcm[a * gn + b];
    return ((v(i, j) * (1 - fj) + v(i, j + 1) * fj) * (1 - fi) + (v(i + 1, j) * (1 - fj) + v(i + 1, j + 1) * fj) * fi) / 100;
  }
  function gradAt(x, y) {
    const e = 0.3;
    return [(heightAt(x + e, y) - heightAt(x - e, y)) / (2 * e), (heightAt(x, y + e) - heightAt(x, y - e)) / (2 * e)];
  }
  // roll a putt: friction + gravity along the slope
  const FRICTION_GREEN = 0.6, FRICTION_OFF = 2.4, G_ROLL = 9.81 * 5 / 7;
  // the cup: same size as drawn (exaggerated like the ball). A ball whose centre passes over it drops if it's slow
  // enough at its closest point to the centre; dead-centre can be quicker than a ball catching the edge.
  // Too fast and it lips out: swings round the rim, leaves at a new angle and loses pace.
  const CUP_HOLE = 0.4, V_CAPTURE = 1.6, V_CAPTURE_MIN = 0.4;
  const captureSpeed = off => Math.max(V_CAPTURE_MIN, V_CAPTURE * Math.sqrt(Math.max(0, 1 - (off / CUP_HOLE) ** 2)));
  function simulatePutt(from, dirAng, flatDist) {
    let p = { ...from }, v = Math.sqrt(2 * FRICTION_GREEN * flatDist), vx = Math.cos(dirAng) * v, vy = Math.sin(dirAng) * v;
    const pts = [{ ...p }], dt = 1 / 120; let time = 0, holed = false, lipped = false;
    let inCup = false, prevD = Infinity;
    for (let n = 0; n < 2400; n++) {
      // over the cup? decide at the closest approach to its centre
      const dc = Math.hypot(p.x - pin.x, p.y - pin.y), sp0 = Math.hypot(vx, vy);
      if (dc < CUP_HOLE) {
        if (!inCup) { inCup = true; prevD = dc; }
        else if (dc > prevD) {                  // just passed the closest point
          if (sp0 < captureSpeed(prevD)) { holed = true; break; }
          // lip out: deflect toward the side of the cup it caught, harder the closer to the edge, and slow it
          const e = prevD / CUP_HOLE, ox = p.x - pin.x, oy = p.y - pin.y;
          const side = Math.sign(vx * oy - vy * ox) || 1, th = -side * e * 1.1, k = 0.55 + 0.2 * e;
          const c = Math.cos(th), s = Math.sin(th);
          [vx, vy] = [(vx * c - vy * s) * k, (vx * s + vy * c) * k];
          lipped = true; inCup = false; prevD = Infinity;
          // carry it clear of the rim so it can't be caught again on the same pass
          const sp1 = Math.hypot(vx, vy) || 1;
          while (Math.hypot(p.x - pin.x, p.y - pin.y) < CUP_HOLE) { p.x += vx / sp1 * 0.02; p.y += vy / sp1 * 0.02; }
          pts.push({ ...p });
          continue;
        } else prevD = dc;
      } else inCup = false;
      const lie = lieAt(p.x, p.y);
      if (lie === 9) break;
      const fr = lie === 3 ? FRICTION_GREEN : FRICTION_OFF;
      const [gx, gy] = gradAt(p.x, p.y), ax_ = -G_ROLL * gx, ay_ = -G_ROLL * gy;
      const sp = Math.hypot(vx, vy);
      if (sp < 0.03) { if (Math.hypot(ax_, ay_) <= fr * 1.05) break; vx += ax_ * dt; vy += ay_ * dt; }
      else {
        vx += (ax_ - fr * vx / sp) * dt; vy += (ay_ - fr * vy / sp) * dt;
        if (vx * (vx - (ax_ - fr * vx / sp) * dt) + vy * (vy - (ay_ - fr * vy / sp) * dt) < 0 && Math.hypot(ax_, ay_) <= fr) { vx = vy = 0; }
      }
      p.x += vx * dt; p.y += vy * dt; time += dt;
      if (n % 3 === 0) pts.push({ ...p });
    }
    if (!holed && Math.hypot(p.x - pin.x, p.y - pin.y) < CUP_HOLE) holed = true;   // came to rest over the hole
    pts.push({ ...p });
    if (holed) { pts.push({ x: pin.x, y: pin.y }); lipped = false; }               // drop into the middle of the cup
    return { pts, time: Math.max(0.4, time), holed, lipped };
  }

  // per-lie shot settings: max carry (yds), seconds per sweep, lateral spread (fraction of carry), lateral period
  const CLUB = {
    4: { max: 260, sweep: 1.7, spread: 0.10, lat: 1.1 },
    2: { max: 230, sweep: 1.6, spread: 0.09, lat: 1.1 },
    1: { max: 205, sweep: 1.55, spread: 0.11, lat: 0.95 },
    0: { max: 175, sweep: 1.45, spread: 0.14, lat: 0.8 },
    5: { max: 90, sweep: 1.3, spread: 0.20, lat: 0.7 },
  };
  const ROLL = { 2: 0.10, 1: 0.05, 0: 0.02, 3: 0.05, 4: 0.08, 5: 0 };

  // ---------- canvas / camera ----------
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let VW, VH, DPR, zoom, baseZoom, cam = { x: IW / 2, y: IH / 2 };
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    VW = innerWidth; VH = innerHeight;
    cv.width = VW * DPR; cv.height = VH * DPR;
    baseZoom = Math.max(VW / IW, VH / IH); zoom = zoom || baseZoom;
  }
  addEventListener("resize", resize); resize();
  const toScreen = (ix, iy) => [(ix - cam.x) * zoom + VW / 2, (iy - cam.y) * zoom + VH / 2];
  // draw an image placed at (ix, iy, iw, ih) in course-image px, cropped to what's on screen:
  // zoomed in on the green, scaling the whole picture every frame was most of the lag
  function drawImg(im, ix, iy, iw, ih) {
    const hw = VW / 2 / zoom, hh = VH / 2 / zoom;
    const x0 = Math.max(ix, cam.x - hw), y0 = Math.max(iy, cam.y - hh);
    const x1 = Math.min(ix + iw, cam.x + hw), y1 = Math.min(iy + ih, cam.y + hh);
    if (x1 <= x0 || y1 <= y0) return;
    const kx = im.naturalWidth / iw, ky = im.naturalHeight / ih;
    ctx.drawImage(im, (x0 - ix) * kx, (y0 - iy) * ky, (x1 - x0) * kx, (y1 - y0) * ky,
                  (x0 - cam.x) * zoom + VW / 2, (y0 - cam.y) * zoom + VH / 2, (x1 - x0) * zoom, (y1 - y0) * zoom);
  }
  function clampCam(t) {
    const hw = VW / 2 / zoom, hh = VH / 2 / zoom;
    t.x = Math.min(Math.max(t.x, hw), IW - hw); t.y = Math.min(Math.max(t.y, hh), IH - hh);
    return t;
  }

  // ---------- state ----------
  // pass-and-play: each player has their own shot state; S always points at the player whose turn it is
  const PCOLS = ["#ff5a5f", "#3fa7ff", "#ffd43b", "#c77dff"];
  const setup = { n: 1, names: ["Player 1", "Player 2", "Player 3", "Player 4"] };
  try { Object.assign(setup, JSON.parse(localStorage.getItem("bgPlayers") || "{}")); } catch (e) {}
  let S, players = [], cur = 0, overlay = false;     // overlay: setup / handover / scorecard is up, so taps don't hit
  const multi = () => players.length > 1;
  function newState() {
    return { ball: { x: D.tee[0], y: D.tee[1] }, prev: null, strokes: 0, lie: 4, phase: "dist", t: 0,
             aim: 0, aimDelta: 0, curve: true, dist: 0, latv: 0, anim: null, done: false };
  }
  function reset() {
    players = setup.names.slice(0, setup.n).map((name, i) => ({ name: name.trim() || `Player ${i + 1}`, col: setup.n > 1 ? PCOLS[i] : "#fff", st: newState() }));
    for (const p of players) { S = p.st; aimAtPin(); }
    switchTo(0);
    cam = clampCam({ ...midTarget() });
    document.getElementById("modal").classList.remove("show");
    if (multi()) showHandover(); else overlay = false;
  }
  function switchTo(i) {
    cur = i; S = players[i].st; S.t = 0;
    const chip = document.getElementById("hPlayerChip");
    chip.classList.toggle("show", multi()); chip.style.setProperty("--pc", players[i].col);
    document.getElementById("hPlayer").textContent = players[i].name;
    updateHud(); setPrompt();
  }
  // who plays next: anyone yet to tee off (in order), otherwise whoever is furthest from the hole
  function nextTurn() {
    const left = players.map((p, i) => i).filter(i => !players[i].st.done);
    if (!left.length) return showScorecard();
    const d = i => Math.hypot(pin.x - players[i].st.ball.x, pin.y - players[i].st.ball.y);
    const fresh = left.find(i => players[i].st.strokes === 0);
    const pick = fresh ?? left.reduce((a, b) => d(b) > d(a) + 1e-6 ? b : a);
    const changed = pick !== cur;
    switchTo(pick);
    if (changed && multi()) showHandover();
  }
  function showHandover() {
    const p = players[cur], el = document.getElementById("handover");
    el.style.setProperty("--pc", p.col);
    document.getElementById("hoName").textContent = `${p.name}'s turn`;
    const dp = toPin();
    document.getElementById("hoInfo").textContent = S.strokes === 0 ? `Tee shot · ${Math.round(dp / YD)} yd to pin`
      : `${LIE[S.lie]} · ${putting() ? `${(dp * 3.281).toFixed(0)} ft` : `${Math.round(dp / YD)} yd`} to pin · ${S.strokes} stroke${S.strokes === 1 ? "" : "s"} so far`;
    el.classList.add("show"); overlay = true;
  }
  function hideHandover() { document.getElementById("handover").classList.remove("show"); overlay = false; S.t = 0; }
  document.getElementById("hoGo").addEventListener("click", hideHandover);

  // setup screen: number of players and names (remembered on this device)
  function renderSetup() {
    const seg = document.getElementById("sCount"); seg.innerHTML = "";
    for (let n = 1; n <= 4; n++) {
      const b = document.createElement("button"); b.textContent = n; b.setAttribute("aria-pressed", n === setup.n);
      b.addEventListener("click", () => { readNames(); setup.n = n; renderSetup(); }); seg.appendChild(b);
    }
    const box = document.getElementById("sNames"); box.innerHTML = "";
    for (let i = 0; i < setup.n; i++) {
      const row = document.createElement("label"); row.className = "pname";
      const dot = document.createElement("i"); dot.style.background = setup.n > 1 ? PCOLS[i] : "#fff";

      const det = A[0][0] * A[1][1] - A[0][1] * A[1][0];      // world direction that points down the screen
      let dn = [-A[0][1] / det, A[0][0] / det]; const dl = Math.hypot(...dn); dn = [dn[0] / dl, dn[1] / dl];
      for (const [r, txt, col] of [[1.5, "+2", "#ffe14a"], [0.55, "+1", "#fff"]]) {
        const [lx, ly] = toScreen(...toImg(pin.x + dn[0] * r, pin.y + dn[1] * r));
        ctx.strokeText(txt, lx, ly); ctx.fillStyle = col; ctx.fillText(txt, lx, ly);
      }
    }
    ctx.restore();
    // flag on top of the overlays
    const [fx, fy] = toScreen(...toImg(pin.x, pin.y)), ph = Math.min(70, Math.max(26, 6 * ppm * zoom));
    ctx.save(); ctx.lineCap = "round";
    const cr = Math.max(putting() ? 9 : 4, CUP_R * ppm * zoom);
    ctx.fillStyle = "#151515"; ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = Math.max(1.5, cr * 0.12);
    ctx.beginPath(); ctx.ellipse(fx, fy, cr, cr * 0.62, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#23461a"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - ph); ctx.stroke();
    ctx.strokeStyle = "#f5f5f5"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - ph); ctx.stroke();
    ctx.fillStyle = "#e4282f"; ctx.strokeStyle = "#23461a"; ctx.lineWidth = 2; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(fx, fy - ph); ctx.lineTo(fx + ph * 0.5, fy - ph * 0.86); ctx.lineTo(fx + ph * 0.4, fy - ph * 0.78);
    ctx.lineTo(fx + ph * 0.52, fy - ph * 0.68); ctx.lineTo(fx, fy - ph * 0.64); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    holdTick(dt);
    if (S.phase === "dist" || S.phase === "lat") S.t += dt;

    // camera follow
    let want;
    if (S.anim) {
      const a = S.anim, k = Math.min(1, a.t / a.dur);
      const p = a.kind === "fly" ? a.posAt(k) : a.to;
      const [ix, iy] = toImg(p.x, p.y); want = { x: ix, y: iy };
    } else want = midTarget();
    let wantZoom = baseZoom;
    // close-up putting view only once everyone still playing is on the green (no zooming in and out between players)
    const allOnGreen = players.every(p => p.st.done || p.st.lie === 3);
    if (S && putting() && allOnGreen && !S.done && !S.anim) {   // frame ball + hole so the gimme rings are readable
      const [bx, by] = toImg(S.ball.x, S.ball.y), [hx, hy] = toImg(pin.x, pin.y);
      const span = Math.max(Math.hypot(bx - hx, by - hy), 4 * ppm);
      wantZoom = Math.min(baseZoom * 9, Math.max(baseZoom * 2.5, 0.42 * Math.min(VW, VH) / span));
      want = { x: (bx + hx) / 2, y: (by + hy) / 2 };
    } else if (S && S.anim && S.anim.kind === "roll") wantZoom = zoom;
    else if (S && S.done && allOnGreen) { wantZoom = zoom; want = { ...cam }; }   // holed out: stay on the green until the next putter (or the scorecard)
    zoom += (wantZoom - zoom) * Math.min(1, dt * 2.5);
    clampCam(want);
    cam.x += (want.x - cam.x) * Math.min(1, dt * 3); cam.y += (want.y - cam.y) * Math.min(1, dt * 3);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#2d5f1a"; ctx.fillRect(0, 0, VW, VH);
    ctx.imageSmoothingQuality = "high";
    drawImg(img, 0, 0, IW, IH);
    drawImg(detailImg, D.detail.x, D.detail.y, D.detail.w, D.detail.h);   // 4x sharper tile around the green
    drawGreenRead(dt);
    drawGimmeRings();
    drawOtherBalls();

    if (S.anim) {
      const a = S.anim; a.t += dt;
      if (a.kind === "fly") {
        const fT = a.dur, rT = 0.5;
        if (a.t < fT) {
          const k = a.t / fT;
          const q = a.posAt(k); drawBall(q.x, q.y, 4 * a.peak * k * (1 - k));
        } else if (a.t < fT + rT) {
          const k = 1 - Math.pow(1 - (a.t - fT) / rT, 2);
          drawBall(a.land.x + (a.rest.x - a.land.x) * k, a.land.y + (a.rest.y - a.land.y) * k, 0);
        } else { drawBall(a.rest.x, a.rest.y, 0); finishShot(); }
      } else {
        const k = Math.min(1, a.t / a.dur), q = a.pts[Math.min(a.pts.length - 1, Math.floor(k * (a.pts.length - 1)))];
        drawBall(q.x, q.y, 0);
        if (k >= 1) finishShot();
      }
    } else {
      if (S.phase === "dist" || S.phase === "lat") drawTarget(currentTarget(), S.phase);
      if (!S.done) drawBall(S.ball.x, S.ball.y, 0);
    }
    requestAnimationFrame(frame);
  }
  reset();                 // course renders behind the setup screen
  openSetup();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
