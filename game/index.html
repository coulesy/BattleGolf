<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pure Golf – Hole 13</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #2d5f1a; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; justify-content: center; padding: 10px; pointer-events: none; }
  .chip { background: rgba(32,64,26,.88); border: 2px solid #9fd06e; border-radius: 14px; padding: 6px 12px; text-align: center; min-width: 78px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .chip b { display: block; font-size: 20px; line-height: 1.1; }
  .chip span { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #c9ee96; }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(14px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; justify-content: center; pointer-events: none; }
  .prompt { background: rgba(32,64,26,.9); border: 2px solid #9fd06e; border-radius: 16px; padding: 10px 16px; font-weight: 700; font-size: 16px; text-align: center; flex: 0 1 320px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .prompt small { display: block; font-weight: 500; font-size: 12px; color: #c9ee96; margin-top: 2px; }
  .aim { pointer-events: auto; width: 54px; height: 54px; border-radius: 50%; border: 2px solid #9fd06e; background: rgba(32,64,26,.9); color: #fff; font-size: 22px; font-weight: 800; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .aim:active { transform: translateY(2px); box-shadow: none; }
  .aim[disabled] { opacity: .35; }
  .toast { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.9); background: #fff; color: #23461a; font-weight: 900; font-size: 26px; padding: 10px 22px; border-radius: 18px; border: 3px solid #2d5f1a; box-shadow: 0 5px 0 rgba(0,0,0,.25); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,25,8,.55); }
  .modal.show { display: flex; }
  .card { background: #f4fbe9; color: #23461a; border: 4px solid #2d5f1a; border-radius: 22px; padding: 22px 26px; text-align: center; width: min(86vw, 340px); box-shadow: 0 8px 0 rgba(0,0,0,.25); }
  .card h2 { margin: 0 0 4px; font-size: 34px; }
  .card p { margin: 4px 0; font-size: 16px; }
  .card button { margin-top: 14px; font: inherit; font-weight: 800; font-size: 18px; padding: 12px 26px; border-radius: 14px; border: 3px solid #2d5f1a; background: #8fd64a; color: #1d3a12; box-shadow: 0 4px 0 #2d5f1a; }
  .card button:active { transform: translateY(3px); box-shadow: 0 1px 0 #2d5f1a; }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="loading" id="loading">Loading course…</div>
<div class="hud">
  <div class="chip"><b id="hStroke">0</b><span>Strokes</span></div>
  <div class="chip"><b id="hPin">–</b><span>To pin</span></div>
  <div class="chip"><b id="hLie">Tee</b><span>Lie</span></div>
</div>
<div class="bottom">
  <button class="aim" id="aimL" aria-label="Aim left">◀</button>
  <div class="prompt" id="prompt">Tap to set distance<small>Target moves toward the hole</small></div>
  <button class="aim" id="aimR" aria-label="Aim right">▶</button>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="card">
  <h2 id="mTitle">Par</h2>
  <p id="mText"></p>
  <p id="mBest"></p>
  <button id="again">Play again</button>
</div></div>

<script>
(async function () {
  const portrait = innerHeight > innerWidth;
  const D = await (await fetch(portrait ? "game_data_portrait.json" : "game_data.json")).json();
  const img = new Image();
  img.src = portrait ? "course_portrait.jpg" : "course.jpg";
  await img.decode();
  const heatImg = new Image(); heatImg.src = D.heat.file;
  const detailImg = new Image(); detailImg.src = D.detail.file;
  await Promise.all([heatImg.decode(), detailImg.decode()]);
  document.getElementById("loading").remove();

  // ---------- data ----------
  const lieBytes = Uint8Array.from(atob(D.lie), ch => ch.charCodeAt(0));
  const LIE = { 0: "Rough", 1: "First cut", 2: "Fairway", 3: "Green", 4: "Tee", 5: "Trees", 9: "OB" };
  const YD = 0.9144;
  const [IW, IH] = D.img;
  const A = D.A, B = D.b;
  const toImg = (x, y) => [A[0][0] * x + A[0][1] * y + B[0], A[1][0] * x + A[1][1] * y + B[1]];
  const ppm = Math.sqrt(Math.abs(A[0][0] * A[1][1] - A[0][1] * A[1][0])); // image px per metre (approx)
  const pin = { x: D.pin[0], y: D.pin[1] };

  function lieAt(x, y) {
    for (const t of D.trees) if (Math.hypot(x - t[0], y - t[1]) < t[2] * 0.75) return 5;
    const i = Math.floor((x - D.gx0) / D.cell), j = Math.floor((y - D.gy0) / D.cell);
    if (i < 0 || j < 0 || i >= D.nx || j >= D.ny) return 9;
    return lieBytes[j * D.nx + i];
  }

  // ---------- green slope (from the green elevation grid, 2 m cells, cm) ----------
  const GG = D.green_grid, gn = GG.n, gstep = GG.step, gcm = GG.cm;
  const cr = Math.cos(-D.north_rot), sr = Math.sin(-D.north_rot);
  function heightAt(x, y) {
    const xg = x - D.pin[0], yg = y - D.pin[1];
    const E = cr * xg - sr * yg, N = sr * xg + cr * yg;
    const gi = Math.min(gn - 1.001, Math.max(0, (gn - 1) / 2 - N / gstep));
    const gj = Math.min(gn - 1.001, Math.max(0, (gn - 1) / 2 + E / gstep));
    const i = Math.floor(gi), j = Math.floor(gj), fi = gi - i, fj = gj - j;
    const v = (a, b) => gcm[a * gn + b];
    return ((v(i, j) * (1 - fj) + v(i, j + 1) * fj) * (1 - fi) + (v(i + 1, j) * (1 - fj) + v(i + 1, j + 1) * fj) * fi) / 100;
  }
  function gradAt(x, y) {
    const e = 0.3;
    return [(heightAt(x + e, y) - heightAt(x - e, y)) / (2 * e), (heightAt(x, y + e) - heightAt(x, y - e)) / (2 * e)];
  }
  // roll a putt: friction + gravity along the slope
  const FRICTION_GREEN = 0.6, FRICTION_OFF = 2.4, G_ROLL = 9.81 * 5 / 7;
  function simulatePutt(from, dirAng, flatDist) {
    let p = { ...from }, v = Math.sqrt(2 * FRICTION_GREEN * flatDist), vx = Math.cos(dirAng) * v, vy = Math.sin(dirAng) * v;
    const pts = [{ ...p }], dt = 1 / 120; let time = 0, holed = false;
    for (let n = 0; n < 2400; n++) {
      const lie = lieAt(p.x, p.y);
      if (lie === 9) break;
      const fr = lie === 3 ? FRICTION_GREEN : FRICTION_OFF;
      const [gx, gy] = gradAt(p.x, p.y), ax_ = -G_ROLL * gx, ay_ = -G_ROLL * gy;
      const sp = Math.hypot(vx, vy);
      if (sp < 0.03) { if (Math.hypot(ax_, ay_) <= fr * 1.05) break; vx += ax_ * dt; vy += ay_ * dt; }
      else {
        vx += (ax_ - fr * vx / sp) * dt; vy += (ay_ - fr * vy / sp) * dt;
        if (vx * (vx - (ax_ - fr * vx / sp) * dt) + vy * (vy - (ay_ - fr * vy / sp) * dt) < 0 && Math.hypot(ax_, ay_) <= fr) { vx = vy = 0; }
      }
      p.x += vx * dt; p.y += vy * dt; time += dt;
      if (Math.hypot(p.x - pin.x, p.y - pin.y) < 0.11 && Math.hypot(vx, vy) < 1.4) { p = { x: pin.x, y: pin.y }; holed = true; pts.push({ ...p }); break; }
      if (n % 3 === 0) pts.push({ ...p });
    }
    pts.push({ ...p });
    return { pts, time: Math.max(0.4, time), holed };
  }

  // per-lie shot settings: max carry (yds), seconds per sweep, lateral spread (fraction of carry), lateral period
  const CLUB = {
    4: { max: 260, sweep: 1.7, spread: 0.10, lat: 1.1 },
    2: { max: 230, sweep: 1.6, spread: 0.09, lat: 1.1 },
    1: { max: 205, sweep: 1.55, spread: 0.11, lat: 0.95 },
    0: { max: 175, sweep: 1.45, spread: 0.14, lat: 0.8 },
    5: { max: 90, sweep: 1.3, spread: 0.20, lat: 0.7 },
  };
  const ROLL = { 2: 0.10, 1: 0.05, 0: 0.02, 3: 0.05, 4: 0.08, 5: 0 };

  // ---------- canvas / camera ----------
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let VW, VH, DPR, zoom, baseZoom, cam = { x: IW / 2, y: IH / 2 };
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    VW = innerWidth; VH = innerHeight;
    cv.width = VW * DPR; cv.height = VH * DPR;
    baseZoom = Math.max(VW / IW, VH / IH); zoom = zoom || baseZoom;
  }
  addEventListener("resize", resize); resize();
  const toScreen = (ix, iy) => [(ix - cam.x) * zoom + VW / 2, (iy - cam.y) * zoom + VH / 2];
  function clampCam(t) {
    const hw = VW / 2 / zoom, hh = VH / 2 / zoom;
    t.x = Math.min(Math.max(t.x, hw), IW - hw); t.y = Math.min(Math.max(t.y, hh), IH - hh);
    return t;
  }

  // ---------- state ----------
  let S;
  function reset() {
    S = { ball: { x: D.tee[0], y: D.tee[1] }, prev: null, strokes: 0, lie: 4, phase: "dist", t: 0,
          aim: 0, aimDelta: 0, curve: true, dist: 0, latv: 0, anim: null, done: false };
    aimAtPin();
    cam = clampCam({ ...midTarget() });
    document.getElementById("modal").classList.remove("show");
    updateHud(); setPrompt();
  }
  function aimAtPin() { S.aim = Math.atan2(pin.y - S.ball.y, pin.x - S.ball.x); }
  const toPin = () => Math.hypot(pin.x - S.ball.x, pin.y - S.ball.y);
  const putting = () => S.lie === 3;

  function shotRange() {
    const dp = toPin();
    if (putting()) return { min: 0.5, max: Math.min(Math.max(3, dp * 2.0), 45) };
    const c = CLUB[S.lie] || CLUB[0];
    return { min: 8, max: Math.min(c.max * YD, dp * 1.4 + 12) };
  }
  function params() {
    if (putting()) return { sweep: 1.8, lat: 1.2, spread: d => 0.1 * d + 0.4 };
    const c = CLUB[S.lie] || CLUB[0];
    return { sweep: c.sweep, lat: c.lat, spread: d => Math.max(5, c.spread * 1.9 * d) };
  }
  const tri = u => { const f = u % 2; return f < 1 ? f : 2 - f; };
  function dirs() { const u = [Math.cos(S.aim), Math.sin(S.aim)]; return { u, v: [u[1], -u[0]] }; }
  // fairway centre line (tee shots follow it, so the shot curves with the dogleg)
  const CL = D.centreline, CLarc = [0];
  for (let i = 1; i < CL.length; i++) CLarc.push(CLarc[i - 1] + Math.hypot(CL[i][0] - CL[i - 1][0], CL[i][1] - CL[i - 1][1]));
  function pathFrame(d) {   // point, forward and sideways directions at distance d along the shot path
    if (!S.curve) { const { u, v } = dirs(); return { p: [S.ball.x + u[0] * d, S.ball.y + u[1] * d], u, v }; }
    let i = 1; while (i < CL.length - 1 && CLarc[i] < d) i++;
    const a = CL[i - 1], b = CL[i], seg = CLarc[i] - CLarc[i - 1];
    let u = [(b[0] - a[0]) / seg, (b[1] - a[1]) / seg];
    const k = (d - CLarc[i - 1]) / seg;          // k > 1 past the green: carry on straight
    let p = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
    const c = Math.cos(S.aimDelta), s = Math.sin(S.aimDelta), ox = D.tee[0], oy = D.tee[1];
    const rot = q => [ox + (q[0] - ox) * c - (q[1] - oy) * s, oy + (q[0] - ox) * s + (q[1] - oy) * c];
    p = rot(p); u = [u[0] * c - u[1] * s, u[0] * s + u[1] * c];
    return { p, u, v: [u[1], -u[0]] };
  }
  function currentTarget() {
    const r = shotRange(), p = params();
    let d = S.dist, lat = 0;
    if (S.phase === "dist") d = r.min + (r.max - r.min) * Math.pow(tri(S.t / p.sweep), 2); // speeds up the further out it gets
    if (S.phase === "lat") lat = p.spread(d) * Math.sin(S.t / p.lat * Math.PI * 2);
    if (S.phase !== "dist" && S.phase !== "lat") { d = S.dist; lat = S.latv; }
    const f = pathFrame(d);
    return { x: f.p[0] + f.v[0] * lat, y: f.p[1] + f.v[1] * lat, d, lat, u: f.u };
  }
  function midTarget() {
    const r = shotRange(), m = Math.min(r.max, toPin()) * 0.5, f = pathFrame(m);
    const [ix, iy] = toImg(f.p[0], f.p[1]);
    return { x: ix, y: iy };
  }

  // ---------- input ----------
  function tap() {
    if (S.done) return;
    if (S.phase === "dist") { S.dist = currentTarget().d; S.phase = "lat"; S.t = 0; setPrompt(); }
    else if (S.phase === "lat") { S.latv = currentTarget().lat; hit(); }
  }
  cv.addEventListener("pointerdown", e => { e.preventDefault(); tap(); });
  addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); tap(); }
    if (e.code === "ArrowLeft") nudge(1); if (e.code === "ArrowRight") nudge(-1); });
  function nudge(s) { if (S.phase !== "dist") return; if (S.curve) S.aimDelta += s * 0.02; else S.aim += s * (putting() ? 0.02 : 0.035); }
  document.getElementById("aimL").addEventListener("pointerdown", e => { e.stopPropagation(); nudge(1); });
  document.getElementById("aimR").addEventListener("pointerdown", e => { e.stopPropagation(); nudge(-1); });
  document.getElementById("again").addEventListener("click", reset);

  // ---------- shot ----------
  function hit() {
    S.strokes++;
    const tgt = currentTarget(), u = tgt.u;
    S.prev = { ...S.ball };
    if (putting()) {
      const from = { ...S.ball };
      const sim = simulatePutt(from, Math.atan2(tgt.y - from.y, tgt.x - from.x), Math.hypot(tgt.x - from.x, tgt.y - from.y));
      S.anim = { kind: "roll", from, pts: sim.pts, to: sim.pts[sim.pts.length - 1], t: 0, dur: Math.min(sim.time, 9), holed: sim.holed };
    } else {
      const land = { x: tgt.x, y: tgt.y };
      const landLie = lieAt(land.x, land.y);
      const rollD = landLie === 9 ? 0 : tgt.d * (ROLL[landLie] ?? 0.03);
      let rest = { x: land.x + u[0] * rollD, y: land.y + u[1] * rollD };
      const restLie = lieAt(rest.x, rest.y);
      if (restLie === 9 || restLie === 5) rest = { ...land };
      // chip-in: does the roll pass over the cup?
      const rdx = rest.x - land.x, rdy = rest.y - land.y, rl2 = rdx * rdx + rdy * rdy || 1;
      const k = Math.max(0, Math.min(1, ((pin.x - land.x) * rdx + (pin.y - land.y) * rdy) / rl2));
      const holed = Math.hypot(land.x + rdx * k - pin.x, land.y + rdy * k - pin.y) < 0.35;
      const D0 = tgt.d, L0 = tgt.lat;
      const posAt = k => { const f = pathFrame(D0 * k); return { x: f.p[0] + f.v[0] * L0 * k, y: f.p[1] + f.v[1] * L0 * k }; };
      S.anim = { kind: "fly", from: S.prev, land, posAt, rest: holed ? { x: pin.x, y: pin.y } : rest, t: 0,
                 dur: 0.8 + tgt.d / 200 * 1.3, peak: Math.min(tgt.d * 0.16, 30), holed, landLie };
    }
    S.phase = "anim"; setPrompt(); updateHud();
  }

  function finishShot() {
    const a = S.anim; S.anim = null;
    S.ball = a.kind === "fly" ? { ...a.rest } : { ...a.to };
    if (a.holed) return holeOut();
    let lie = lieAt(S.ball.x, S.ball.y);
    if (lie === 9) {
      S.strokes++; S.ball = { ...S.prev }; lie = lieAt(S.ball.x, S.ball.y);
      toast("Out of bounds  +1");
    } else if (lie === 5) toast("In the trees!");
    else if (a.kind === "fly" && lie === 3) toast("On the green");
    else if (a.kind === "roll" && toPin() < 1.2) toast("So close!");
    // gimme rings: rest within 1 m = +1 stroke, within 2 m = +2 strokes, then holed
    if (lie !== 9) { const dp = toPin();
      if (dp <= 2) { const g = dp <= 1 ? 1 : 2; S.strokes += g; return holeOut(`Gimme  +${g}`); } }
    S.lie = lie === 9 ? 0 : lie;
    if (S.lie === 4) S.lie = 2;
    if (S.prev && Math.hypot(S.ball.x - D.tee[0], S.ball.y - D.tee[1]) < 3) S.lie = 4;
    S.curve = S.lie === 4; S.aimDelta = 0;
    S.phase = "dist"; S.t = 0; aimAtPin(); updateHud(); setPrompt();
  }

  function holeOut(msg) {
    S.done = true; S.phase = "done"; S.ball = { ...pin }; updateHud(); setPrompt();
    const diff = S.strokes - D.par;
    const names = { "-3": "Albatross!", "-2": "Eagle!", "-1": "Birdie!", "0": "Par", "1": "Bogey", "2": "Double bogey", "3": "Triple bogey" };
    const title = S.strokes === 1 ? "Hole in one!" : (names[diff] || `+${diff}`);
    let best = null;
    try { best = +localStorage.getItem("pg_h13_best") || null; if (!best || S.strokes < best) { localStorage.setItem("pg_h13_best", S.strokes); } } catch (e) {}
    toast(msg || "In the hole!");
    setTimeout(() => {
      document.getElementById("mTitle").textContent = title;
      document.getElementById("mText").textContent = `${S.strokes} stroke${S.strokes > 1 ? "s" : ""} on a par ${D.par}`;
      document.getElementById("mBest").textContent = best ? (S.strokes < best ? "New best score!" : `Best: ${best}`) : "";
      document.getElementById("modal").classList.add("show");
    }, 1100);
  }

  // ---------- UI ----------
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1400);
  }
  function updateHud() {
    document.getElementById("hStroke").textContent = S.strokes;
    const d = toPin();
    document.getElementById("hPin").textContent = putting() ? `${(d * 3.281).toFixed(0)} ft` : `${Math.round(d / YD)} yd`;
    document.getElementById("hLie").textContent = LIE[S.lie];
  }
  function setPrompt() {
    const p = document.getElementById("prompt");
    const aimOn = S.phase === "dist";
    document.getElementById("aimL").disabled = !aimOn; document.getElementById("aimR").disabled = !aimOn;
    if (S.phase === "dist") p.innerHTML = (putting() ? `Tap to set putt strength<small>Ball breaks downhill · ◀ ▶ to aim</small>` : `Tap to set distance<small>◀ ▶ to adjust aim</small>`);
    else if (S.phase === "lat") p.innerHTML = `Tap to set direction<small>Stop it on the line</small>`;
    else if (S.phase === "anim") p.innerHTML = putting() ? "Rolling…" : "Ball in flight…";
    else p.innerHTML = "Holed out!";
  }

  // ---------- draw ----------
  function circle(x, y, r, fill, stroke, lw) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.lineWidth = lw || 2; ctx.strokeStyle = stroke; ctx.stroke(); }
  }
  function drawBall(gx, gy, h) {
    const [sx, sy] = toScreen(...toImg(gx, gy));
    const r = Math.max(4, 0.55 * ppm * zoom);
    ctx.fillStyle = "rgba(20,50,15,.35)";
    ctx.beginPath(); ctx.ellipse(sx + h * 0.15 * ppm * zoom, sy, r * 1.1, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    circle(sx, sy - h * ppm * zoom, r, "#fff", "#2d5f1a", 2);
  }
  function drawTarget(t, phase) {
    const [bx, by] = toScreen(...toImg(S.ball.x, S.ball.y));
    const [tx, ty] = toScreen(...toImg(t.x, t.y));
    ctx.save();
    ctx.setLineDash([6, 7]); ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,.85)";
    ctx.beginPath(); ctx.moveTo(bx, by);
    for (let i = 1; i <= 24; i++) { const f = pathFrame(t.d * i / 24);
      ctx.lineTo(...toScreen(...toImg(f.p[0] + f.v[0] * t.lat * i / 24, f.p[1] + f.v[1] * t.lat * i / 24))); }
    ctx.stroke();
    ctx.setLineDash([]);
    if (phase === "lat") { // show the sweep band
      const p = params(), f = pathFrame(S.dist), v = f.v, sp = p.spread(S.dist);
      const c = { x: f.p[0], y: f.p[1] };
      const [ax, ay] = toScreen(...toImg(c.x - v[0] * sp, c.y - v[1] * sp));
      const [cx2, cy2] = toScreen(...toImg(c.x + v[0] * sp, c.y + v[1] * sp));
      const [mx, my] = toScreen(...toImg(c.x, c.y));
      ctx.lineWidth = 6; ctx.strokeStyle = "rgba(30,60,20,.55)"; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(cx2, cy2); ctx.stroke();
      circle(mx, my, 5, "#ffe14a", "#2d5f1a", 2);
    }
    const r = putting() ? Math.max(7, 0.3 * ppm * zoom) : Math.max(12, 3 * ppm * zoom);
    circle(tx, ty, r, "rgba(255,255,255,.18)", "#fff", 3);
    circle(tx, ty, r * 0.35, "#e8383d", "#fff", 2);
    const label = putting() ? `${(t.d * 3.281).toFixed(0)} ft` : `${Math.round(t.d / YD)} yd`;
    ctx.font = "800 15px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 4; ctx.strokeStyle = "#23461a";
    ctx.strokeText(label, tx, ty - r - 8); ctx.fillStyle = "#fff"; ctx.fillText(label, tx, ty - r - 8);
    ctx.restore();
  }

  function ring(rad, fill, stroke, dash) {
    ctx.beginPath();
    for (let i = 0; i <= 48; i++) { const a = i / 48 * Math.PI * 2;
      const [sx, sy] = toScreen(...toImg(pin.x + Math.cos(a) * rad, pin.y + Math.sin(a) * rad));
      i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); }
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    ctx.setLineDash(dash); ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke(); ctx.setLineDash([]);
  }
  let heatA = 0;
  function drawGreenRead(dt) {
    const on = S && S.lie === 3 && !S.done;
    heatA += ((on ? 1 : 0) - heatA) * Math.min(1, dt * 3);
    if (heatA < 0.02) return;
    ctx.save(); ctx.globalAlpha = heatA;
    const [hx, hy] = toScreen(D.heat.x, D.heat.y);
    ctx.drawImage(heatImg, hx, hy, D.heat.w * zoom, D.heat.h * zoom);
    const pxPerM = ppm * zoom;
    if (pxPerM > 6) {   // downhill arrows
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      const R0 = 22, sp = pxPerM > 14 ? 2.0 : 3.0;
      for (let gx = -R0; gx <= R0; gx += sp) for (let gy = -R0; gy <= R0; gy += sp) {
        const x = pin.x + gx, y = pin.y + gy;
        if (lieAt(x, y) !== 3 || Math.hypot(gx, gy) < 1.2) continue;
        const [sx, sy] = gradAt(x, y), slope = Math.hypot(sx, sy);
        if (slope < 0.004) continue;
        const len = Math.min(1.3, 0.35 + slope * 22), ux = -sx / slope, uy = -sy / slope;
        const [ax0, ay0] = toScreen(...toImg(x - ux * len / 2, y - uy * len / 2));
        const [ax1, ay1] = toScreen(...toImg(x + ux * len / 2, y + uy * len / 2));
        const ang = Math.atan2(ay1 - ay0, ax1 - ax0), hl = Math.max(4, Math.min(7, pxPerM * 0.3));
        const arrow = () => { ctx.beginPath(); ctx.moveTo(ax0, ay0); ctx.lineTo(ax1, ay1);
          ctx.moveTo(ax1 - hl * Math.cos(ang - 0.6), ay1 - hl * Math.sin(ang - 0.6)); ctx.lineTo(ax1, ay1);
          ctx.lineTo(ax1 - hl * Math.cos(ang + 0.6), ay1 - hl * Math.sin(ang + 0.6)); ctx.stroke(); };
        ctx.strokeStyle = "rgba(20,40,15,.55)"; ctx.lineWidth = 3.6; arrow();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.8; arrow();
      }
    }
    ctx.restore();
  }
  function drawGimmeRings() {
    ctx.save();
    ring(2, "rgba(255,225,74,.16)", "rgba(255,225,74,.95)", [5, 4]);
    ring(1, "rgba(255,255,255,.22)", "rgba(255,255,255,.95)", []);
    const pxPerM = ppm * zoom;
    if (pxPerM > 7) {   // labels only once zoomed in enough to read
      ctx.font = `800 ${Math.round(Math.min(14, pxPerM * 0.9))}px system-ui, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineWidth = 3; ctx.strokeStyle = "#23461a";
      const det = A[0][0] * A[1][1] - A[0][1] * A[1][0];      // world direction that points down the screen
      let dn = [-A[0][1] / det, A[0][0] / det]; const dl = Math.hypot(...dn); dn = [dn[0] / dl, dn[1] / dl];
      for (const [r, txt, col] of [[1.5, "+2", "#ffe14a"], [0.55, "+1", "#fff"]]) {
        const [lx, ly] = toScreen(...toImg(pin.x + dn[0] * r, pin.y + dn[1] * r));
        ctx.strokeText(txt, lx, ly); ctx.fillStyle = col; ctx.fillText(txt, lx, ly);
      }
    }
    ctx.restore();
    // flag on top of the overlays
    const [fx, fy] = toScreen(...toImg(pin.x, pin.y)), ph = Math.min(70, Math.max(26, 6 * ppm * zoom));
    ctx.save(); ctx.lineCap = "round";
    ctx.fillStyle = "#151515"; ctx.beginPath(); ctx.ellipse(fx, fy, 4, 2.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#23461a"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - ph); ctx.stroke();
    ctx.strokeStyle = "#f5f5f5"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - ph); ctx.stroke();
    ctx.fillStyle = "#e4282f"; ctx.strokeStyle = "#23461a"; ctx.lineWidth = 2; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(fx, fy - ph); ctx.lineTo(fx + ph * 0.5, fy - ph * 0.86); ctx.lineTo(fx + ph * 0.4, fy - ph * 0.78);
    ctx.lineTo(fx + ph * 0.52, fy - ph * 0.68); ctx.lineTo(fx, fy - ph * 0.64); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (S.phase === "dist" || S.phase === "lat") S.t += dt;

    // camera follow
    let want;
    if (S.anim) {
      const a = S.anim, k = Math.min(1, a.t / a.dur);
      const p = a.kind === "fly" ? a.posAt(k) : a.to;
      const [ix, iy] = toImg(p.x, p.y); want = { x: ix, y: iy };
    } else want = midTarget();
    let wantZoom = baseZoom;
    if (S && putting() && !S.done && !S.anim) {   // frame ball + hole so the gimme rings are readable
      const [bx, by] = toImg(S.ball.x, S.ball.y), [hx, hy] = toImg(pin.x, pin.y);
      const span = Math.max(Math.hypot(bx - hx, by - hy), 4 * ppm);
      wantZoom = Math.min(baseZoom * 9, Math.max(baseZoom * 2.5, 0.42 * Math.min(VW, VH) / span));
      want = { x: (bx + hx) / 2, y: (by + hy) / 2 };
    } else if (S && S.anim && S.anim.kind === "roll") wantZoom = zoom;
    zoom += (wantZoom - zoom) * Math.min(1, dt * 2.5);
    clampCam(want);
    cam.x += (want.x - cam.x) * Math.min(1, dt * 3); cam.y += (want.y - cam.y) * Math.min(1, dt * 3);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#2d5f1a"; ctx.fillRect(0, 0, VW, VH);
    const [ox, oy] = toScreen(0, 0);
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(img, ox, oy, IW * zoom, IH * zoom);
    const [dx, dy] = toScreen(D.detail.x, D.detail.y);          // 4x sharper tile around the green
    ctx.drawImage(detailImg, dx, dy, D.detail.w * zoom, D.detail.h * zoom);
    drawGreenRead(dt);
    drawGimmeRings();

    if (S.anim) {
      const a = S.anim; a.t += dt;
      if (a.kind === "fly") {
        const fT = a.dur, rT = 0.5;
        if (a.t < fT) {
          const k = a.t / fT;
          const q = a.posAt(k); drawBall(q.x, q.y, 4 * a.peak * k * (1 - k));
        } else if (a.t < fT + rT) {
          const k = 1 - Math.pow(1 - (a.t - fT) / rT, 2);
          drawBall(a.land.x + (a.rest.x - a.land.x) * k, a.land.y + (a.rest.y - a.land.y) * k, 0);
        } else { drawBall(a.rest.x, a.rest.y, 0); finishShot(); }
      } else {
        const k = Math.min(1, a.t / a.dur), q = a.pts[Math.min(a.pts.length - 1, Math.floor(k * (a.pts.length - 1)))];
        drawBall(q.x, q.y, 0);
        if (k >= 1) finishShot();
      }
    } else {
      if (S.phase === "dist" || S.phase === "lat") drawTarget(currentTarget(), S.phase);
      if (!S.done) drawBall(S.ball.x, S.ball.y, 0);
    }
    requestAnimationFrame(frame);
  }
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
